<!doctype html>
<html lang="{{lang}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{titel}} — {{display_name}}</title>
<link rel="stylesheet" href="/static/style.css?v={{fassung}}">
</head>
<body>

<!--
  Der Mandantenname wird serverseitig eingesetzt (app/main.py, Endpunkt
  "oberflaeche"). Es gibt bewusst keinen Endpunkt, ueber den diese Seite ihn
  nachladen koennte - das waere ein Endpunkt, der Mandantendaten ausgibt.

  Dasselbe gilt fuer die Sprache und alle Texte: Sie kommen aus dem Katalog in
  app/texts.py, ausgewaehlt ueber das Feld language des Mandanten. Diese Seite
  leitet nichts aus der Browsereinstellung ab.

  Das Token steht in data-token und wird nur fuer den Aufruf des eigenen
  Chat-Endpunkts gebraucht.

  Das ?v= an den beiden statischen Dateien ist der Inhaltsschluessel aus
  app/main.py, statische_fassung(). Aendert sich eine der Dateien, aendert sich
  die Adresse, und ein Browser kann die alte Fassung nicht mehr liefern. Der
  Grund steht in knowledge/open-points.md, OP-054: Am 2026-09-23 lieferte ein
  Browser ein app.js von vor EN-1 mit deutschen Zeichenketten aus, obwohl die
  Datei im Image englisch war.
-->

<header>
  <h1>{{titel}}</h1>
  <p class="mandant">{{display_name}}</p>
</header>

<main id="verlauf" aria-live="polite">
  <div class="nachricht assistent">
    <div class="text">{{begruessung}}</div>
  </div>
</main>

<form id="formular" data-token="{{url_token}}" autocomplete="off">
  <label class="versteckt" for="frage">{{frage_label}}</label>
  <textarea id="frage" name="frage" rows="2" maxlength="2000"
            placeholder="{{frage_platzhalter}}"
            required></textarea>
  <button type="submit" id="senden">{{senden}}</button>
</form>

<footer>
  <p>{{fusszeile}}</p>
</footer>

<!--
  Die Texte, die app.js zur Laufzeit braucht. Als JSON-Datenblock und nicht als
  Literale im Skript: app.js wird unter /static/ fuer alle Mandanten gleich
  ausgeliefert und kann deshalb keine mandantenabhaengige Sprache enthalten.
-->
<script id="texte" type="application/json">{{texte_json}}</script>

<script src="/static/app.js?v={{fassung}}"></script>
</body>
</html>
