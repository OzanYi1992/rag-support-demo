# Demo-Mandant. ERFUNDENE Inhalte, keine echten Interessentendaten.
#
# Dieser Mandant liegt im oeffentlichen Repo und darf in ein oeffentliches
# Container-Image (public_image_allowed: true). Das ist nur zulaessig, WEIL die
# Inhalte erfunden sind.
#
# Angelegt fuer die englischsprachige Welle. Bewusst ein eigener Zuschnitt und
# KEINE Uebersetzung von Acme oder Nordwind: Outdoor-Ausruestung im
# Versandhandel, eigene Produkte, eigene Fristen, eigene Zahlen. Ueberlappende
# Korpora machen den Nachweis fremder_mandant wertlos.
#
# Bewusst NICHT abgedeckt: technischer Support, Vorgangsnummern,
# Reaktionszeiten, Eskalationsstufen. Diese Themen liegen bei demo-acme, und
# zwar auch auf Englisch (docs/technical-support-en.md). Genau daraus wird im
# Goldsatz der schaerfste Isolationsfall: gleiche Sprache auf beiden Seiten,
# nur die Mandantengrenze trennt.
#
# Der slug steht bewusst nicht in dieser Datei - er kommt aus dem
# Verzeichnisnamen.

display_name: "Fellgate Outdoor"

# Oberflaeche, serverseitige Meldungen und die Sprache des Regelwerks im
# System-Prompt. Nicht die Antwortsprache.
language: en

# What this tenant answers about. Derived from the files in docs/, not from a
# wish to look capable: anything named here but missing from the corpus produces
# exactly the question that has to escalate.
topics: >
  orders and shipping, the countries we deliver to, sizes and our range,
  returns and exchanges, payment and refunds, gear care and repairs, and
  Trail Club membership

system_prompt_extra: >
  Fellgate Outdoor sells outdoor clothing and equipment by mail order to private
  customers. Answer plainly and in full sentences. Whenever a deadline, a price
  or a threshold is involved, state the exact figure from the knowledge base and
  never an estimate. Many rules differ by delivery zone or by Trail Club level;
  if the answer depends on one of those, say which.

escalation_message: >
  I cannot find anything reliable about that in the Fellgate Outdoor documents.
  Please write to support@fellgate.example and someone will help you directly.

# Kein Override: dieser Mandant nutzt das Modell aus der Konfiguration.
model_override: null

# Bleibt 6, obwohl der Korpus seit 2026-10-02 groesser ist als der von
# demo-acme. Die fruehere Begruendung, gleicher Umfang wie demo-acme, traegt
# damit nicht mehr. Der Wert bleibt bewusst stehen, damit sich in diesem
# Schritt nur der Korpus aendert. Eine Herleitung aus dem Umfang ist fuer alle
# Mandanten gemeinsam offen.
#
# Was hier ausdruecklich NICHT eingeflossen ist: Im Goldsatzlauf vom 2026-09-22
# lag eine erwartete Textstelle auf Chunkrang 7. Ein top_k von 7 haette genau
# diese Frage gruen gemacht - und damit waere der Messaufbau aus dem
# gewuenschten Ergebnis abgeleitet. Der Wert waere dann keine Einstellung mehr,
# sondern eine Anpassung an den eigenen Test.
retrieval_top_k: 6

# Oeffentliche Adresse des Mandanten. Erzeugt mit
# app.tenants.generate_url_token(): 32 Zeichen, 192 Bit, ohne Mandantennamen.
# Anders als bei den beiden bestehenden Mandanten, die den Slug noch im Token
# tragen.
url_token: d87hbtOOvupTpJcbDIlZ4oqIX6dsKVoI

public_image_allowed: true
