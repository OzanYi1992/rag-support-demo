# Demo-Mandant. ERFUNDENE Inhalte, keine echten Interessentendaten.
#
# Dieser Mandant liegt im oeffentlichen Repo und darf in ein oeffentliches
# Container-Image (public_image_allowed: true, ADR-014). Das ist nur zulaessig,
# WEIL die Inhalte erfunden sind.
#
# Der slug steht bewusst nicht in dieser Datei - er kommt aus dem
# Verzeichnisnamen. Sonst koennten Verzeichnis und Inhalt auseinanderlaufen.

display_name: "ACME Elektronikhandel"

# Sprache dieses Mandanten: Oberflaeche, serverseitige Meldungen und die
# Sprache, in der das Regelwerk des System-Prompts formuliert ist. NICHT die
# Antwortsprache - die folgt weiterhin der Frage.
#
# Stand vorher: eine Liste languages: [de, en]. Sie wurde von keiner Zeile Code
# gelesen und ist deshalb entfallen.
#
# Die Angabe war inhaltlich richtig: docs/ enthaelt mit technical-support-en.md
# eine englische Parallelfassung. Der Mandant bleibt trotzdem language: de - das
# Feld sagt, in welcher Sprache die Oberflaeche laeuft, nicht welche Sprachen im
# Korpus vorkommen. Ein deutscher Interessent soll eine deutsche Oberflaeche
# sehen, auch wenn ein Dokument englisch ist.
language: de

system_prompt_extra: >
  ACME beliefert Gewerbekunden mit Elektronikbauteilen. Antworte sachlich und
  knapp. Nenne bei Lieferzeiten und Mindestbestellmengen immer die Quelle aus der
  Wissensbasis. Preise nur nennen, wenn sie dort ausdruecklich stehen.

escalation_message: >
  Dazu finde ich in den Unterlagen von ACME nichts Belastbares. Bitte wenden Sie
  sich an support@acme.example - dort kann Ihnen jemand direkt weiterhelfen.

# Kein Override: dieser Mandant nutzt das Modell aus der Konfiguration.
model_override: null

# Etwas mehr Kontext als der Default, weil die Produktdaten kleinteilig sind.
retrieval_top_k: 6

# Oeffentliche Adresse des Mandanten (ADR-007). Fester Wert, damit die Tests
# reproduzierbar sind; fuer einen echten Mandanten erzeugt
# app.tenants.generate_url_token() einen zufaelligen.
url_token: "demo-acme-oeffentlich-7f3a91c4e2"

public_image_allowed: true
